<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive supernova simulation: stellar evolution, core collapse, ejecta, remnants and an Earth-view observer with light-travel time. Educational, physically-motivated, runs entirely in your browser." />
    <meta name="theme-color" content="#04060d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Supernova Simulation</title>
  </head>
  <body data-view="close">
    <div id="app">
      <canvas id="scene-canvas"></canvas>
      <canvas id="earth-canvas"></canvas>
      <div id="ui" class="ui-layer"></div>
    </div>
    <noscript>This simulation needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
